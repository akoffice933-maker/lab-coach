# Быстрый lab: Juice Shop + DVWA в изолированной сети 172.30.0.0/24.
# Metasploitable — отдельная VM, см. practice/LAB-VM-GUIDE.md.
#
#   docker compose up -d
#   cp practice/.env.docker .env
#   python -m lab_coach session-init juiceshop 172.30.0.10 --category web
#   python -m lab_coach scan http://172.30.0.10:3000/
#   python -m lab_coach session-init dvwa 172.30.0.11 --category web
#   python -m lab_coach scan http://172.30.0.11/
#
# Остановить: docker compose down

name: lab-coach-lab

networks:
  lab:
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:
  juiceshop:
    image: bkimminich/juice-shop:v17.3.0
    restart: unless-stopped
    networks:
      lab:
        ipv4_address: 172.30.0.10
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: "unsafe"

  dvwa:
    image: vulnerables/web-dvwa:latest
    restart: unless-stopped
    networks:
      lab:
        ipv4_address: 172.30.0.11
    ports:
      - "127.0.0.1:4280:80"
